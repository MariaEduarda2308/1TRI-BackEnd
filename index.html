<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Cadastro de clientes</h1>
<form>
<label for="nome">Nome:</label>
<input type="text" id="nome" placeholder="Digite seu nome aqui" required>
<label for="email">Email:</label>
<input type="email" id="email" required>
<label for="celular">Celular:</label>
<input type="tel" id="celular" placeholder="(42) 91234-5678" required>
<label for="cpf">Cpf:</label>
<input type="text" id="cpf" placeholder="000.000.000-00" required>
<label for="cep">CEP:</label>
<input type="text" id="cep" placeholder="00000-000" required>
<label for="rua">Rua:</label>
<input type="text" id="rua" placeholder="Rua aurea" required>
<label for="número">Número:</label>
<input type="text" id="numero" placeholder="67" required>
<label for="bairro">Bairro:</label>
<input type="text" id="bairro" placeholder="Bairro ego" required>
<label for="cidade">Cidade:</label>
<input type="text" id="cidade" placeholder="city mogged" required>
<label for="uf">UF:</label>
<input type="text" id="uf" placeholder="...a" required>
<label for="senha">Senha:</label>
<input type="text" id="senha" placeholder="abcede3123" required>
